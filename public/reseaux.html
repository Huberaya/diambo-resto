<style>

  .eyebrow::before { content: ''; width: 32px; height: 1px; background: currentColor; }
  h1 { margin: 14px 0 8px; font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; font-size: clamp(44px, 11vw, 62px); letter-spacing: -.04em; line-height: .95; }

  .lead { margin: 0 auto; max-width: 340px; color: var(--muted); font-size: 13.5px; line-height: 1.7; text-align: center; }
  .links { margin-top: 40px; display: flex; flex-direction: column; gap: 14px; }
  .link-card { display: flex; align-items: center; gap: 18px; padding: 19px 20px; background: var(--ivory); border: 1px solid var(--line); transition: transform .35s cubic-bezier(.16,1,.3,1), background .3s ease, color .3s ease, border-color .3s ease, box-shadow .35s ease; }
  .link-card:active { transform: scale(.98); }
  .icon { flex: 0 0 auto; display: grid; place-items: center; width: 50px; height: 50px; border: 1px solid var(--line); border-radius: 50%; background: var(--cream); transition: background .3s ease, border-color .3s ease; }
  .icon svg { width: 22px; height: 22px; }
  .copy { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .copy strong { font-family: 'DM Serif Display', Georgia, serif; font-weight: 400; font-size: 23px; letter-spacing: -.02em; }
  .copy small { color: var(--muted); font-family: 'Space Grotesk', sans-serif; font-size: 11px; letter-spacing: .1em; transition: color .3s ease; }
  .arrow { margin-left: auto; flex: 0 0 auto; color: var(--muted); transition: transform .35s cubic-bezier(.16,1,.3,1), color .3s ease; }
  .link-card:hover { transform: translateY(-4px); color: #fff; border-color: transparent; box-shadow: 0 18px 36px rgba(28,24,21,.16); }
  .link-card:hover .copy small { color: rgba(255,255,255,.75); }
  .link-card:hover .icon { background: #fff; border-color: #fff; }
  .link-card:hover .arrow { transform: translate(3px,-3px); color: rgba(255,255,255,.85); }
  .c-instagram:hover { background: linear-gradient(135deg, #f9ce34 0%, #ee2a7b 52%, #6228d7 100%); }
  .c-instagram:hover .icon { color: #ee2a7b; }
  .c-facebook:hover { background: #1877f2; }
  .c-facebook:hover .icon { color: #1877f2; }
  .c-youtube:hover { background: #e62117; }
  .c-youtube:hover .icon { color: #e62117; }
  .c-tiktok:hover { background: #0f0f0f; }
  .c-tiktok:hover .icon { color: #0f0f0f; }
  .c-web { background: var(--espresso); border-color: var(--espresso); color: #fff; }
  .c-web .icon { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.32); color: #f1cf9e; }
  .c-web .copy small { color: rgba(255,255,255,.66); }
  .c-web .arrow { color: rgba(255,255,255,.7); }
  .c-web:hover { background: var(--terracotta); border-color: var(--terracotta); }
  .c-web:hover .icon { background: #fff; border-color: #fff; color: var(--terracotta-deep); }
  .c-web:hover .copy small { color: rgba(255,255,255,.85); }
  footer { margin-top: 44px; text-align: center; }
  .sep { width: 34px; height: 1px; margin: 0 auto 22px; background: var(--gold); }
  .addr { color: var(--muted); font-size: 12px; line-height: 1.7; }
  .addr a { color: var(--terracotta-deep); font-weight: 600; }
